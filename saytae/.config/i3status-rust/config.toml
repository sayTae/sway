icons_format = "{icon}"

[theme]
theme = "native"
# theme = "slick"
# theme = "plain"
# theme = "modern"
# theme = "gruvbox-dark"

# ---------------- TIMER ----------------
[[block]]
block = "tea_timer"
format = " 日本 {$minutes:$seconds |}"
# format = "  {$minutes:$seconds |}"
increment = 30
done_cmd = "notify-send -t 3000 'お時間です。' && mpv --no-terminal ~/.bell.mp3"

# ---------------- NETWORK ----------------
[[block]]
block = "net"
format = " 󰖩  $ssid "
format_alt = " $ip ($signal_strength) "

# ---------------- IP ----------------
[[block]]
block = "net"
format = " $ip ($signal_strength) "

# ---------------- UP/DOWN ----------------
[[block]]
block = "net"
format = " ▼ $speed_down.eng(p:M, w:4, hide_unit)  ▲ $speed_up.eng(p:M, w:4, hide_unit) "

# ---------------- UPTIME----------------
# [[block]]
# block = "uptime"
# interval = 60 # update every hour

# ---------------- MEMORY ----------------
[[block]]
block = "memory"
format = " 💾 $mem_used / $mem_total "

# ---------------- CPU ----------------
[[block]]
block = "cpu"
interval = 2
format = "◉ $utilization.eng(w:2) "

# ---------------- TEMPERATURE ----------------
[[block]]
block = "temperature"
interval = 5
format = " 🌡 $average "

# ---------------- SOUND ----------------
[[block]]
block = "sound"
format = " 🔊 $volume "

# ---------------- BATTERY ----------------
[[block]]
block = "battery"
driver = "sysfs"
format = " 🔋 $percentage "
charging_format = " 🔌 $percentage " 
full_format = " 🔋 フル "

# ---------------- TIME ----------------
[[block]]
block = "custom"
interval = 1
command = "date '+󰃭  %m月%d日(%a)  %H時%M分%S秒'"
